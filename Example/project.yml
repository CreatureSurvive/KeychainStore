name: KeychainHost
options:
  bundleIdPrefix: com.creaturesurvive
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
settings:
  base:
    DEVELOPMENT_TEAM: RUMWXF5QY3
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  KeychainStore:
    path: ..
targets:
  KeychainHost:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [KeychainHost]
    dependencies:
      - package: KeychainStore
    info:
      path: KeychainHost/Info.plist
      properties:
        UILaunchScreen: {}
    entitlements:
      path: KeychainHost/KeychainHost.entitlements
      properties:
        keychain-access-groups: [$(AppIdentifierPrefix)com.creaturesurvive.KeychainHost]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creaturesurvive.KeychainHost
  KeychainHostTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: ../Tests/KeychainStoreTests
    dependencies:
      - target: KeychainHost
      - package: KeychainStore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.creaturesurvive.KeychainHostTests
        GENERATE_INFOPLIST_FILE: YES
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/KeychainHost.app/Contents/MacOS/KeychainHost
schemes:
  KeychainHost:
    build:
      targets:
        KeychainHost: all
        KeychainHostTests: [test]
    test:
      targets: [KeychainHostTests]
